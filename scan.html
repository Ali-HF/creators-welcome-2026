<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Creators Welcome 2026 — Gate Admission Scanner</title>
  <meta name="description" content="Minimal single-screen mobile gate scanner for Creators Welcome 2026">
  <link rel="stylesheet" href="assets/css/styles.css?v=3.0">
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

  <!-- Minimal Top Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">CW</div>
        <div class="brand-title">CREATORS WELCOME</div>
      </a>

      <div class="nav-links">
        <div class="nav-pill-title">GATE SCANNER</div>
        <div id="connectionStatusBadge" class="connection-badge mock">
          <span class="pulse-dot"></span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Single-Screen Wrapper -->
  <main class="main-wrapper" style="padding: 1rem 0.75rem;">
    
    <div class="mobile-scanner-wrapper">
      
      <!-- Top Camera Viewport Block -->
      <div class="scanner-viewport-compact" id="scannerViewport">
        <div id="reader"></div>
        <div id="scanOverlay" class="scan-overlay">
          <div class="spinner-ring"></div>
          <div style="font-weight: 800; font-size: 1.1rem; color: var(--dark-main);">⚡ QR Code Captured</div>
          <div id="overlayPassId" style="font-family: var(--font-mono); font-size: 0.95rem; color: var(--slate-600); margin-top: 0.25rem;">Verifying pass...</div>
        </div>
        <button onclick="toggleCameraFlip()" class="btn btn-secondary" style="position: absolute; top: 8px; right: 8px; z-index: 5; padding: 0.3rem 0.6rem; font-size: 0.75rem; border-radius: var(--radius-pill);">
          🔄 Flip
        </button>
      </div>

      <!-- Verification Status Bar (Directly below camera, replaces button bar) -->
      <div id="statusBar" class="status-bar-container idle">
        <button id="btnStartScan" class="btn btn-dark btn-block" onclick="startScanner()" style="border: none;">
          ▶️ Start Camera Scanner
        </button>
        <div id="statusContent" style="display: none; align-items: center; gap: 0.4rem;">
          <span id="statusIcon">📱</span>
          <span id="statusTitle">READY FOR SCAN</span>
        </div>
      </div>

      <!-- Attendee Details Card (Directly below status bar) -->
      <div class="attendee-details-compact">
        <div id="detailsName" style="font-size: 1.3rem; font-weight: 800; color: var(--dark-main); line-height: 1.2;">
          READY FOR ENTRY
        </div>
        
        <div style="display: flex; align-items: center; justify-content: center; gap: 0.65rem; margin-top: 0.4rem; flex-wrap: wrap;">
          <span id="detailsRoll" style="font-family: var(--font-mono); color: var(--emerald-600); font-weight: 700; font-size: 0.95rem;">#CS-2026</span>
          <span id="detailsPassId" style="font-family: var(--font-mono); background: var(--dark-main); color: var(--white); font-size: 0.85rem; padding: 2px 10px; border-radius: var(--radius-pill); font-weight: 700;">#CW26-000</span>
        </div>

        <div id="detailsSubtext" style="font-size: 0.8rem; color: var(--slate-500); margin-top: 0.4rem;">
          Point QR code at camera above or use manual override below.
        </div>
      </div>

      <!-- Compact Manual Override Entry & QR File Upload -->
      <div class="card" style="width: 100%; max-width: 360px; padding: 0.85rem 1rem;">
        <form onsubmit="handleManualScan(event)" style="display: flex; gap: 0.4rem;">
          <input type="text" id="manualPassId" class="form-control mono" placeholder="Enter Pass ID e.g. #CW26-001" style="padding: 0.5rem 0.75rem; font-size: 0.85rem; border-radius: var(--radius-pill);" required>
          <button type="submit" class="btn btn-dark" style="white-space: nowrap; padding: 0.5rem 1rem; font-size: 0.85rem;">
            Verify
          </button>
        </form>

        <div style="display: flex; gap: 0.5rem; margin-top: 0.65rem; justify-content: center;">
          <input type="file" id="qrFileInput" accept="image/*" style="display:none;" onchange="handleFileScan(event)">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('qrFileInput').click()" style="font-size: 0.75rem; padding: 0.35rem 0.85rem; width: 100%;">
            📁 Select QR Photo / File
          </button>
        </div>
      </div>

      <!-- Stop Camera Button (when camera active) -->
      <button id="btnStopScan" class="btn btn-secondary btn-block" onclick="stopScanner()" style="display: none; max-width: 360px; font-size: 0.8rem; padding: 0.4rem;">
        ⏹️ Pause Camera Scanner
      </button>

    </div>

  </main>

  <!-- Mobile Bottom Navigation Bar matching Reference Image -->
  <div class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <span class="nav-icon">📊</span>
      <span>Dashboard</span>
    </a>
    <a href="generate.html" class="bottom-nav-item">
      <span class="nav-icon">🎟️</span>
      <span>Issue Pass</span>
    </a>
    <a href="scan.html" class="bottom-nav-item active">
      <span class="nav-icon">⚡</span>
      <span>Scanner</span>
    </a>
    <a href="#" onclick="document.getElementById('settingsModal') && document.getElementById('settingsModal').classList.add('open')" class="bottom-nav-item">
      <span class="nav-icon">⚙️</span>
      <span>Settings</span>
    </a>
  </div>

  <script src="assets/js/app.js?v=3.0"></script>
  <script src="assets/js/api.js?v=3.0"></script>
  <script>
    let html5QrCode = null;
    let isScanning = false;
    let currentFacingMode = "environment";
    let scanCooldown = false;

    function setScannerState(state, title, name, roll, passId, subtext, icon) {
      const statusBar = document.getElementById('statusBar');
      const btnStart = document.getElementById('btnStartScan');
      const statusContent = document.getElementById('statusContent');
      const statusTitle = document.getElementById('statusTitle');
      const statusIcon = document.getElementById('statusIcon');

      const detailsName = document.getElementById('detailsName');
      const detailsRoll = document.getElementById('detailsRoll');
      const detailsPassId = document.getElementById('detailsPassId');
      const detailsSubtext = document.getElementById('detailsSubtext');

      statusBar.className = `status-bar-container ${state}`;

      if (state === 'idle' && !isScanning) {
        btnStart.style.display = 'block';
        statusContent.style.display = 'none';
      } else {
        btnStart.style.display = 'none';
        statusContent.style.display = 'flex';
        statusTitle.innerText = title;
        statusIcon.innerText = icon || '📱';
      }

      detailsName.innerText = (name || 'READY FOR ENTRY').toUpperCase();
      detailsRoll.innerText = roll || '#ROLL';
      detailsPassId.innerText = passId || '#CW26-000';
      detailsSubtext.innerText = subtext || '';

      if (state === 'approved') {
        detailsName.style.color = 'var(--emerald-600)';
        detailsRoll.style.color = 'var(--emerald-600)';
      } else if (state === 'duplicate') {
        detailsName.style.color = 'var(--rose-500)';
        detailsRoll.style.color = 'var(--rose-500)';
      } else if (state === 'invalid') {
        detailsName.style.color = '#b45309';
        detailsRoll.style.color = 'var(--slate-500)';
      } else {
        detailsName.style.color = 'var(--dark-main)';
        detailsRoll.style.color = 'var(--emerald-600)';
      }
    }

    async function processPassVerification(passIdStr) {
      if (scanCooldown) return;
      scanCooldown = true;

      const cleanId = passIdStr.trim().toUpperCase();

      if (typeof AppUtils.playScanBeep === 'function') {
        AppUtils.playScanBeep();
      }

      if (html5QrCode && isScanning) {
        try { html5QrCode.pause(true); } catch(e){}
      }

      const viewport = document.getElementById('scannerViewport');
      const overlay = document.getElementById('scanOverlay');
      if (viewport) viewport.classList.add('validating');
      if (overlay) {
        document.getElementById('overlayPassId').innerText = `Verifying ${cleanId}...`;
        overlay.classList.add('active');
      }

      setScannerState(
        'validating',
        `VERIFYING ${cleanId}...`,
        'CHECKING DATABASE...',
        cleanId,
        '#CW26-VERIFYING',
        'Validating pass with gate lock server...',
        '⏳'
      );

      try {
        const res = await CW26Api.callApi('checkAndScanPass', { passId: cleanId });

        if (viewport) viewport.classList.remove('validating');
        if (overlay) overlay.classList.remove('active');

        if (res && res.success && res.state === 'APPROVED') {
          const pass = res.pass;
          setScannerState(
            'approved',
            '🟢 ENTRY APPROVED',
            pass.name || 'ATTENDEE',
            pass.rollNo || '#ROLL',
            pass.passId || cleanId,
            'Entry Registered! Welcome to Creators Welcome 2026.',
            '🟢'
          );
          AppUtils.playSuccessTone();

        } else if (res && res.state === 'DUPLICATE') {
          const pass = res.pass || {};
          setScannerState(
            'duplicate',
            '🔴 ALREADY SCANNED / DUPLICATE',
            pass.name || 'ATTENDEE',
            pass.rollNo || '#ROLL',
            pass.passId || cleanId,
            res.message || 'Scanned previously at gate.',
            '🔴'
          );
          AppUtils.playWarningTone();

        } else {
          setScannerState(
            'invalid',
            '⚠️ INVALID PASS ID',
            'UNRECOGNIZED PASS',
            cleanId,
            cleanId,
            res.message || 'Pass ID not found in database.',
            '⚠️'
          );
          AppUtils.playWarningTone();
        }

      } catch (err) {
        console.error(err);
        if (viewport) viewport.classList.remove('validating');
        if (overlay) overlay.classList.remove('active');
        AppUtils.showToast('Scanner verification error', 'error');
      } finally {
        setTimeout(() => {
          if (html5QrCode && isScanning) {
            try { html5QrCode.resume(); } catch(e){}
            setScannerState('idle', 'CAMERA ACTIVE — READY', 'READY FOR NEXT SCAN', '#CS-2026', '#CW26-000', 'Point next attendee QR pass at camera box.', '📷');
          }
          scanCooldown = false;
        }, 2500);
      }
    }

    function handleManualScan(e) {
      e.preventDefault();
      const val = document.getElementById('manualPassId').value.trim();
      if (!val) return;
      processPassVerification(val);
      document.getElementById('manualPassId').value = '';
    }

    function handleFileScan(e) {
      const file = e.target.files[0];
      if (!file) return;

      AppUtils.showToast('Reading QR code from image...', 'info');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.scanFile(file, true)
        .then(decodedText => {
          processPassVerification(decodedText);
        })
        .catch(err => {
          console.error("QR File parse error", err);
          AppUtils.showToast('No valid QR Code found in image', 'error');
        });
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = { fps: 10, qrbox: { width: 200, height: 200 } };

      function tryStart(cameraConfig) {
        return html5QrCode.start(
          cameraConfig,
          config,
          (decodedText) => {
            processPassVerification(decodedText);
          },
          (errorMessage) => {}
        );
      }

      function onSuccess() {
        isScanning = true;
        document.getElementById('btnStopScan').style.display = 'block';
        setScannerState('idle', 'CAMERA ACTIVE — READY', 'READY FOR NEXT SCAN', '#CS-2026', '#CW26-000', 'Point attendee QR pass at camera box.', '📷');
        AppUtils.showToast('Camera scanner active', 'success');
      }

      function onFail(err) {
        console.error("Camera start error", err);
        AppUtils.showToast('Camera access unavailable. Use manual override or file upload below.', 'warning');
      }

      // Try Environment (rear) camera first, fallback to any camera or User (front) camera
      tryStart({ facingMode: currentFacingMode })
        .then(onSuccess)
        .catch(() => {
          Html5Qrcode.getCameras().then(cameras => {
            if (cameras && cameras.length > 0) {
              tryStart(cameras[0].id).then(onSuccess).catch(onFail);
            } else {
              tryStart({ facingMode: "user" }).then(onSuccess).catch(onFail);
            }
          }).catch(() => {
            tryStart({ facingMode: "user" }).then(onSuccess).catch(onFail);
          });
        });
    }

    function stopScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
          isScanning = false;
          document.getElementById('btnStopScan').style.display = 'none';
          setScannerState('idle', 'CAMERA PAUSED', 'READY FOR SCAN', '#CS-2026', '#CW26-000', 'Click Start Camera to begin scanning.', '📱');
          AppUtils.showToast('Camera scanner paused', 'info');
        }).catch(err => console.error(err));
      }
    }

    function toggleCameraFlip() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      if (isScanning) {
        stopScanner();
        setTimeout(startScanner, 400);
      }
    }

    // Auto-start camera scanner on page load if supported
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(startScanner, 500);
    });
  </script>
</body>
</html>
