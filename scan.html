<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Creators Welcome 2026 — Mobile Gate Scanner</title>
  <meta name="description" content="Single-screen mobile gate scanner for Creators Welcome 2026">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body style="overflow-x: hidden;">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">CW</div>
        <div>
          <div class="brand-title">CREATORS WELCOME</div>
        </div>
        <span class="brand-badge">2026 OPS</span>
      </a>

      <div class="nav-links">
        <a href="index.html" class="nav-item">📊</a>
        <a href="generate.html" class="nav-item">🎟️</a>
        <a href="scan.html" class="nav-item active">⚡ Scanner</a>
        <div id="connectionStatusBadge" class="connection-badge mock">
          <span class="pulse-dot"></span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Single-Screen Wrapper -->
  <main class="main-wrapper" style="padding: 1rem 0.75rem 2rem 0.75rem;">
    
    <div class="mobile-scanner-wrapper">
      
      <!-- Top Camera Viewport Block -->
      <div class="scanner-viewport-compact" id="scannerViewport">
        <div id="reader"></div>
        <div id="scanOverlay" class="scan-overlay">
          <div class="spinner-ring"></div>
          <div style="font-weight: 700; font-size: 1.1rem; color: var(--amber-500);">⚡ QR Code Captured</div>
          <div id="overlayPassId" style="font-family: var(--font-mono); font-size: 0.95rem; color: var(--white); margin-top: 0.25rem;">Verifying pass...</div>
        </div>
        <button onclick="toggleCameraFlip()" class="btn btn-ghost" style="position: absolute; top: 8px; right: 8px; z-index: 5; background: rgba(0,0,0,0.6); padding: 0.35rem 0.65rem; font-size: 0.75rem; border-radius: var(--radius-sm);">
          🔄 Flip
        </button>
      </div>

      <!-- Verification Status Bar (Directly below camera, replaces button bar) -->
      <div id="statusBar" class="status-bar-container idle">
        <button id="btnStartScan" class="btn btn-emerald btn-block" onclick="startScanner()" style="border: none;">
          ▶️ Start Camera Scanner
        </button>
        <div id="statusContent" style="display: none; align-items: center; gap: 0.5rem;">
          <span id="statusIcon">📱</span>
          <span id="statusTitle">READY FOR SCAN</span>
        </div>
      </div>

      <!-- Attendee Details Card (Directly below status bar) -->
      <div class="attendee-details-compact">
        <div id="detailsName" style="font-size: 1.35rem; font-weight: 800; color: var(--white); line-height: 1.2;">
          READY FOR ENTRY
        </div>
        
        <div style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 0.5rem; flex-wrap: wrap;">
          <span id="detailsRoll" style="font-family: var(--font-mono); color: var(--emerald-500); font-weight: 700; font-size: 0.95rem;">#CS-2026</span>
          <span id="detailsPassId" style="font-family: var(--font-mono); color: var(--slate-300); font-size: 0.9rem;">#CW26-000</span>
        </div>

        <div id="detailsSubtext" style="font-size: 0.8rem; color: var(--slate-400); margin-top: 0.5rem;">
          Point QR code at camera box above for instant gate admission.
        </div>
      </div>

      <!-- Compact Manual Override Entry -->
      <div class="card" style="width: 100%; max-width: 380px; padding: 0.85rem 1rem;">
        <form onsubmit="handleManualScan(event)" style="display: flex; gap: 0.5rem;">
          <input type="text" id="manualPassId" class="form-control mono" placeholder="Enter Pass ID e.g. #CW26-001" style="padding: 0.5rem 0.75rem; font-size: 0.85rem;" required>
          <button type="submit" class="btn btn-primary" style="white-space: nowrap; padding: 0.5rem 0.85rem; font-size: 0.85rem;">
            Verify
          </button>
        </form>
      </div>

      <!-- Stop Camera Button (when camera active) -->
      <button id="btnStopScan" class="btn btn-secondary btn-block" onclick="stopScanner()" style="display: none; max-width: 380px; font-size: 0.85rem; padding: 0.5rem;">
        ⏹️ Pause Camera Scanner
      </button>

    </div>

  </main>

  <script src="assets/js/app.js?v=1.2"></script>
  <script src="assets/js/api.js?v=1.2"></script>
  <script>
    let html5QrCode = null;
    let isScanning = false;
    let currentFacingMode = "environment";
    let scanCooldown = false;

    function setScannerState(state, title, name, roll, passId, subtext, icon) {
      const statusBar = document.getElementById('statusBar');
      const btnStart = document.getElementById('btnStartScan');
      const statusContent = document.getElementById('statusContent');
      const statusTitle = document.getElementById('statusTitle');
      const statusIcon = document.getElementById('statusIcon');

      const detailsName = document.getElementById('detailsName');
      const detailsRoll = document.getElementById('detailsRoll');
      const detailsPassId = document.getElementById('detailsPassId');
      const detailsSubtext = document.getElementById('detailsSubtext');

      // Update status bar styling
      statusBar.className = `status-bar-container ${state}`;

      if (state === 'idle' && !isScanning) {
        btnStart.style.display = 'block';
        statusContent.style.display = 'none';
      } else {
        btnStart.style.display = 'none';
        statusContent.style.display = 'flex';
        statusTitle.innerText = title;
        statusIcon.innerText = icon || '📱';
      }

      // Update details card
      detailsName.innerText = (name || 'READY FOR ENTRY').toUpperCase();
      detailsRoll.innerText = roll || '#ROLL';
      detailsPassId.innerText = passId || '#CW26-000';
      detailsSubtext.innerText = subtext || '';

      // Text colors based on status
      if (state === 'approved') {
        detailsName.style.color = '#ffffff';
        detailsRoll.style.color = 'var(--emerald-500)';
      } else if (state === 'duplicate') {
        detailsName.style.color = '#ffffff';
        detailsRoll.style.color = 'var(--rose-500)';
      } else if (state === 'invalid') {
        detailsName.style.color = 'var(--amber-500)';
        detailsRoll.style.color = 'var(--slate-400)';
      } else {
        detailsName.style.color = 'var(--white)';
        detailsRoll.style.color = 'var(--emerald-500)';
      }
    }

    async function processPassVerification(passIdStr) {
      if (scanCooldown) return;
      scanCooldown = true;

      const cleanId = passIdStr.trim().toUpperCase();

      // Audio Beep
      if (typeof AppUtils.playScanBeep === 'function') {
        AppUtils.playScanBeep();
      }

      // Pause camera detection during verification
      if (html5QrCode && isScanning) {
        try { html5QrCode.pause(true); } catch(e){}
      }

      const viewport = document.getElementById('scannerViewport');
      const overlay = document.getElementById('scanOverlay');
      if (viewport) viewport.classList.add('validating');
      if (overlay) {
        document.getElementById('overlayPassId').innerText = `Verifying ${cleanId}...`;
        overlay.classList.add('active');
      }

      // Update status bar to VALIDATING state
      setScannerState(
        'validating',
        `VERIFYING ${cleanId}...`,
        'CHECKING DATABASE...',
        cleanId,
        '#CW26-VERIFYING',
        'Validating pass with gate lock server...',
        '⏳'
      );

      try {
        const res = await CW26Api.callApi('checkAndScanPass', { passId: cleanId });

        if (viewport) viewport.classList.remove('validating');
        if (overlay) overlay.classList.remove('active');

        if (res && res.success && res.state === 'APPROVED') {
          const pass = res.pass;
          setScannerState(
            'approved',
            '🟢 ENTRY APPROVED',
            pass.name || 'ATTENDEE',
            pass.rollNo || '#ROLL',
            pass.passId || cleanId,
            'Entry Registered! Welcome to Creators Welcome 2026.',
            '🟢'
          );
          AppUtils.playSuccessTone();

        } else if (res && res.state === 'DUPLICATE') {
          const pass = res.pass || {};
          setScannerState(
            'duplicate',
            '🔴 ALREADY SCANNED / DUPLICATE',
            pass.name || 'ATTENDEE',
            pass.rollNo || '#ROLL',
            pass.passId || cleanId,
            res.message || 'Scanned previously at gate.',
            '🔴'
          );
          AppUtils.playWarningTone();

        } else {
          setScannerState(
            'invalid',
            '⚠️ INVALID PASS ID',
            'UNRECOGNIZED PASS',
            cleanId,
            cleanId,
            res.message || 'Pass ID not found in database.',
            '⚠️'
          );
          AppUtils.playWarningTone();
        }

      } catch (err) {
        console.error(err);
        if (viewport) viewport.classList.remove('validating');
        if (overlay) overlay.classList.remove('active');
        AppUtils.showToast('Scanner verification error', 'error');
      } finally {
        // Auto-resume camera scanning after 2.5 seconds buffer
        setTimeout(() => {
          if (html5QrCode && isScanning) {
            try { html5QrCode.resume(); } catch(e){}
            setScannerState('idle', 'CAMERA ACTIVE — READY', 'READY FOR NEXT SCAN', '#CS-2026', '#CW26-000', 'Point next attendee QR pass at camera box.', '📷');
          }
          scanCooldown = false;
        }, 2500);
      }
    }

    function handleManualScan(e) {
      e.preventDefault();
      const val = document.getElementById('manualPassId').value.trim();
      if (!val) return;
      processPassVerification(val);
      document.getElementById('manualPassId').value = '';
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = { fps: 10, qrbox: { width: 200, height: 200 } };

      html5QrCode.start(
        { facingMode: currentFacingMode },
        config,
        (decodedText) => {
          processPassVerification(decodedText);
        },
        (errorMessage) => {}
      ).then(() => {
        isScanning = true;
        document.getElementById('btnStopScan').style.display = 'block';
        setScannerState('idle', 'CAMERA ACTIVE — READY', 'READY FOR NEXT SCAN', '#CS-2026', '#CW26-000', 'Point attendee QR pass at camera box.', '📷');
        AppUtils.showToast('Camera scanner active', 'success');
      }).catch(err => {
        console.error("Camera start error", err);
        AppUtils.showToast('Could not access camera. Try manual override below.', 'error');
      });
    }

    function stopScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
          isScanning = false;
          document.getElementById('btnStopScan').style.display = 'none';
          setScannerState('idle', 'CAMERA PAUSED', 'READY FOR SCAN', '#CS-2026', '#CW26-000', 'Click Start Camera to begin scanning.', '📱');
          AppUtils.showToast('Camera scanner paused', 'info');
        }).catch(err => console.error(err));
      }
    }

    function toggleCameraFlip() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      if (isScanning) {
        stopScanner();
        setTimeout(startScanner, 400);
      }
    }
  </script>
</body>
</html>
